[package]
name = "table-width-opt"
version = "0.1.0"
edition = "2021"
description = "Optimize TeX table column widths from PDF layout metrics"

[lib]
name = "table_width_opt"
path = "src/lib.rs"

[[bin]]
name = "table-width-opt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pdfium-render = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
z3 = "0.12"

[dev-dependencies]
approx = "0.5"
